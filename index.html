<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บันทึกอารมณ์วันนี้</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(135deg, #fff7fb, #f3f0ff);
      color: #3f3a4a;
      min-height: 100vh;
    }
    .container {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 50px;
    }
    header {
      text-align: center;
      margin-bottom: 26px;
    }
    header h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 6vw, 42px);
    }
    header p {
      margin: 0;
      color: #777080;
      font-size: 16px;
    }
    .card {
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(150,130,160,.14);
      border-radius: 24px;
      padding: 26px;
      box-shadow: 0 12px 35px rgba(85,65,105,.09);
      margin-bottom: 20px;
    }
    .moods {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin: 20px 0;
    }
    .mood {
      border: 2px solid transparent;
      background: #faf8fc;
      border-radius: 18px;
      padding: 16px 8px;
      cursor: pointer;
      transition: .2s ease;
      color: #4b4554;
      font-size: 14px;
    }
    .mood:hover { transform: translateY(-3px); }
    .mood.selected {
      border-color: #a875d1;
      background: #f7edff;
      box-shadow: 0 5px 16px rgba(168,117,209,.18);
    }
    .emoji { display: block; font-size: 34px; margin-bottom: 7px; }
    label {
      display: block;
      font-weight: 700;
      margin: 14px 0 8px;
    }
    textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      border: 1px solid #ddd5e3;
      border-radius: 15px;
      padding: 13px;
      font: inherit;
      outline: none;
    }
    textarea:focus { border-color: #a875d1; }
    .save {
      width: 100%;
      border: 0;
      border-radius: 15px;
      padding: 14px;
      background: linear-gradient(90deg, #a875d1, #d181a8);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .save:hover { filter: brightness(.97); }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab {
      border: 0;
      background: #eeeaf2;
      color: #5d5665;
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
    }
    .tab.active { background: #a875d1; color: white; }
    .history-item {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 15px 0;
      border-bottom: 1px solid #eee8f0;
    }
    .history-item:last-child { border-bottom: 0; }
    .history-emoji { font-size: 31px; }
    .history-content { flex: 1; }
    .history-title { font-weight: 700; }
    .history-date { color: #918a97; font-size: 13px; margin-top: 3px; }
    .history-note { margin-top: 7px; color: #5f5965; white-space: pre-wrap; }
    .delete {
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 18px;
      opacity: .65;
    }
    .empty {
      text-align: center;
      padding: 25px 5px;
      color: #928b98;
    }
    .sticker-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,.35);
      backdrop-filter: blur(4px);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    .sticker-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .sticker-card {
      background: white;
      border-radius: 30px;
      padding: 28px 34px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(85,65,105,.18);
      animation: stickerPop .55s cubic-bezier(.2,1.5,.4,1);
      max-width: 320px;
    }
    .sticker {
      font-size: 82px;
      line-height: 1;
      display: block;
      animation: stickerBounce 1s ease-in-out infinite;
    }
    .sticker-card h2 {
      margin: 14px 0 6px;
      color: #7d5a9e;
    }
    .sticker-card p {
      margin: 0;
      color: #777080;
    }
    @keyframes stickerPop {
      from { transform: scale(.45) rotate(-8deg); opacity: 0; }
      to { transform: scale(1) rotate(0); opacity: 1; }
    }
    @keyframes stickerBounce {
      0%,100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-9px) rotate(3deg); }
    }


    .sticker-gallery{margin-top:26px;padding-top:22px;border-top:1px dashed #e4dbe9}.sticker-gallery h3{text-align:center;margin:0 0 14px;color:#765b87}.sticker-list{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.cute-sticker{border-radius:18px;padding:10px 5px;text-align:center;background:#fff9fd;border:1px solid #eee2f1;transition:.2s}.cute-sticker:hover{transform:translateY(-5px) rotate(1deg);box-shadow:0 8px 18px rgba(120,90,140,.12)}.sticker-face{width:64px;height:64px;margin:0 auto 7px;display:flex;align-items:center;justify-content:center;font-size:43px;background:white;border-radius:50%;box-shadow:0 4px 12px rgba(100,80,110,.10)}.cute-sticker span:last-child{font-size:12px;color:#766e7b;font-weight:700}@media(max-width:650px){.sticker-list{grid-template-columns:repeat(3,1fr)}}

    .weekly-chart { margin-top:24px; padding:20px; border-radius:18px; background:#faf8fc; }
    .weekly-chart h3 { margin:0 0 5px; text-align:center; color:#765b87; }
    .chart-subtitle { text-align:center; color:#928b98; font-size:13px; margin:0 0 18px; }
    .chart-container { height:260px; position:relative; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 20px);
      background: #3f3a4a;
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 650px) {
      .container { width: min(100% - 20px, 920px); padding-top: 24px; }
      .card { padding: 18px; border-radius: 20px; }
      .moods { grid-template-columns: repeat(3, 1fr); }
      .mood { padding: 13px 5px; }
      .emoji { font-size: 29px; }
    }
    @media (max-width: 400px) {
      .moods { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>✨ บันทึกอารมณ์วันนี้ ✨</h1>
      <p>วันนี้รู้สึกอย่างไรบ้าง? มาบันทึกไว้กันเถอะ!</p>
    </header>

    <section class="card">
      <h2>วันนี้ฉันรู้สึก...</h2>
      <div class="moods" id="moods"></div>

      <label for="note">อยากเล่าอะไรเพิ่มเติมไหม?</label>
      <textarea id="note" placeholder="เขียนความรู้สึกหรือเรื่องราวของวันนี้..."></textarea>


      <br><br>
      <button class="save" id="saveBtn">❤️ บันทึกอารมณ์</button>
    </section>

    <section class="card">
      <div class="tabs">
        <button class="tab active" data-tab="history">📖 ประวัติ</button>
        <button class="tab" data-tab="stats">📊 สรุป</button>
      </div>
      <div id="historyView"></div>
      <div id="statsView" hidden></div>
    </section>
  </main>

  <div class="sticker-overlay" id="stickerOverlay">
    <div class="sticker-card">
      <span class="sticker" id="stickerEmoji">🥰</span>
      <h2>บันทึกแล้ว! ✨</h2>
      <p id="stickerMessage">ขอบคุณที่แบ่งปันความรู้สึกนะ 💕</p>
    </div>
  </div>

  <div class="toast" id="toast">บันทึกเรียบร้อยแล้ว ❤️</div>

  <script>
    const moods = [
      { id: "happy", emoji: "😊", name: "สดใส" },
      { id: "excited", emoji: "🥳", name: "ตื่นเต้น" },
      { id: "relaxed", emoji: "😌", name: "ผ่อนคลาย" },
      { id: "sad", emoji: "🥺", name: "เหงา/เศร้า" },
      { id: "angry", emoji: "😡", name: "หงุดหงิด" }
    ];

    let selectedMood = null;
    const moodsEl = document.getElementById("moods");
    const noteEl = document.getElementById("note");
    const historyView = document.getElementById("historyView");
    const statsView = document.getElementById("statsView");
    const toast = document.getElementById("toast");
    const stickerOverlay = document.getElementById("stickerOverlay");
    const stickerEmoji = document.getElementById("stickerEmoji");
    const stickerMessage = document.getElementById("stickerMessage");

    const stickerByMood = {
      happy:    { emoji: "🌈", message: "วันนี้สดใสมากเลย! เก็บรอยยิ้มนี้ไว้นะ 💖" },
      excited:  { emoji: "🎉", message: "ว้าว! ขอให้ความตื่นเต้นนี้พาไปเจอเรื่องดี ๆ นะ ✨" },
      relaxed:  { emoji: "🧸", message: "พักผ่อนและดูแลตัวเองดี ๆ นะ 🌷" },
      sad:      { emoji: "🌷", message: "ขอบคุณที่บอกความรู้สึกนะ ขอให้วันนี้ค่อย ๆ ดีขึ้น 💕" },
      angry:    { emoji: "🫶", message: "ไม่เป็นไรนะ ทุกความรู้สึกมีพื้นที่ของมันเสมอ 🌼" }
    };

    function renderMoods() {
      moodsEl.innerHTML = moods.map(m => `
        <button class="mood ${selectedMood === m.id ? "selected" : ""}" data-id="${m.id}">
          <span class="emoji">${m.emoji}</span>${m.name}
        </button>
      `).join("");

      document.querySelectorAll(".mood").forEach(btn => {
        btn.addEventListener("click", () => {
          selectedMood = btn.dataset.id;
          renderMoods();
        });
      });
    }

    function getEntries() {
      return JSON.parse(localStorage.getItem("moodEntries") || "[]");
    }

    function saveEntries(entries) {
      localStorage.setItem("moodEntries", JSON.stringify(entries));
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleString("th-TH", {
        dateStyle: "medium",
        timeStyle: "short"
      });
    }

    function renderHistory() {
      const entries = getEntries();
      if (!entries.length) {
        historyView.innerHTML = '<div class="empty">ยังไม่มีบันทึกอารมณ์ 🌷<br>ลองบันทึกความรู้สึกของวันนี้ดูนะ</div>';
        return;
      }

      historyView.innerHTML = entries.map(entry => {
        const mood = moods.find(m => m.id === entry.mood);
        return `
          <div class="history-item">
            <div class="history-emoji">${mood.emoji}</div>
            <div class="history-content">
              <div class="history-title">${mood.name}</div>
              <div class="history-date">${formatDate(entry.date)}</div>
              ${entry.note ? `<div class="history-note">${escapeHtml(entry.note)}</div>` : ""}
            </div>
            <button class="delete" title="ลบรายการ" data-delete="${entry.id}">🗑️</button>
          </div>
        `;
      }).join("");

      document.querySelectorAll("[data-delete]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = Number(btn.dataset.delete);
          saveEntries(getEntries().filter(e => e.id !== id));
          renderHistory();
          renderStats();
        });
      });
    }

    function renderStats() {
      const entries = getEntries();
      if (!entries.length) {
        statsView.innerHTML = '<div class="empty">ยังไม่มีข้อมูลสำหรับสรุป 📊</div>';
        return;
      }

      const counts = {};
      moods.forEach(m => counts[m.id] = 0);
      entries.forEach(e => counts[e.mood]++);

      const today = new Date();
      const weekDays = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date(today);
        d.setHours(0,0,0,0);
        d.setDate(d.getDate() - i);
        weekDays.push(d);
      }
      const labels = weekDays.map(d => d.toLocaleDateString("th-TH",{weekday:"short"}));
      const weekly = weekDays.map(d => {
        const next = new Date(d); next.setDate(next.getDate()+1);
        return entries.filter(e => {
          const date = new Date(e.date);
          return date >= d && date < next;
        }).length;
      });

      statsView.innerHTML = `
        <div class="weekly-chart">
          <h3>📈 ภาพรวมอารมณ์ 1 อาทิตย์</h3>
          <p class="chart-subtitle">จำนวนครั้งที่บันทึกอารมณ์ในช่วง 7 วันที่ผ่านมา</p>
          <div class="chart-container"><canvas id="weeklyChart"></canvas></div>
        </div>
        <h3 style="margin-top:24px">อารมณ์ที่บันทึกทั้งหมด ${entries.length} ครั้ง</h3>
        ${moods.map(m => {
          const count = counts[m.id];
          const percent = Math.round(count / entries.length * 100);
          return `<div style="margin:14px 0">
            <div style="display:flex;justify-content:space-between;margin-bottom:6px">
              <span>${m.emoji} ${m.name}</span><strong>${count} ครั้ง</strong>
            </div>
            <div style="height:10px;background:#eee8f0;border-radius:99px;overflow:hidden">
              <div style="height:100%;width:${percent}%;background:linear-gradient(90deg,#a875d1,#d181a8);border-radius:99px"></div>
            </div>
          </div>`;
        }).join("")}
      `;

      const canvas = document.getElementById("weeklyChart");
      const ctx = canvas.getContext("2d");
      const width = canvas.parentElement.clientWidth, height = 260;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = width*dpr; canvas.height = height*dpr;
      canvas.style.width = width+"px"; canvas.style.height = height+"px";
      ctx.scale(dpr,dpr);
      const p={l:38,r:15,t:20,b:38}, cw=width-p.l-p.r, ch=height-p.t-p.b;
      const maxY=Math.max(1,...weekly);
      ctx.font="12px sans-serif";
      for(let i=0;i<=4;i++){
        const v=Math.round(maxY*i/4), y=p.t+ch-ch*i/4;
        ctx.strokeStyle="#e8e1eb"; ctx.beginPath(); ctx.moveTo(p.l,y); ctx.lineTo(width-p.r,y); ctx.stroke();
        ctx.fillStyle="#9a929e"; ctx.textAlign="right"; ctx.textBaseline="middle"; ctx.fillText(v,p.l-8,y);
      }
      const space=cw/7, bw=Math.min(32,space*.55);
      weekly.forEach((v,i)=>{
        const bh=v===0?0:v/maxY*ch, x=p.l+i*space+(space-bw)/2, y=p.t+ch-bh;
        if(v>0){
          const g=ctx.createLinearGradient(x,y,x,p.t+ch);
          g.addColorStop(0,"#a875d1"); g.addColorStop(1,"#d181a8");
          ctx.fillStyle=g; ctx.beginPath(); ctx.roundRect(x,y,bw,bh,8); ctx.fill();
          ctx.fillStyle="#765b87"; ctx.textAlign="center"; ctx.textBaseline="bottom"; ctx.fillText(v,x+bw/2,y-5);
        }
        ctx.fillStyle="#777080"; ctx.textAlign="center"; ctx.textBaseline="top";
        ctx.fillText(labels[i],x+bw/2,p.t+ch+10);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById("saveBtn").addEventListener("click", () => {
      if (!selectedMood) {
        alert("กรุณาเลือกอารมณ์ก่อนบันทึกนะ 😊");
        return;
      }

      const entries = getEntries();
      entries.unshift({
        id: Date.now(),
        mood: selectedMood,
        note: noteEl.value.trim(),
        date: new Date().toISOString()
      });

      saveEntries(entries);
      selectedMood = null;
      noteEl.value = "";
      renderMoods();
      renderHistory();
      renderStats();

      const sticker = stickerByMood[entries[0].mood] || { emoji: "🥰", message: "ขอบคุณที่แบ่งปันความรู้สึกนะ 💕" };
      stickerEmoji.textContent = sticker.emoji;
      stickerMessage.textContent = sticker.message;
      stickerOverlay.classList.add("show");

      setTimeout(() => {
        stickerOverlay.classList.remove("show");
      }, 2200);

      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1800);
    });

    stickerOverlay.addEventListener("click", () => {
      stickerOverlay.classList.remove("show");
    });

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");

        const showHistory = tab.dataset.tab === "history";
        historyView.hidden = !showHistory;
        statsView.hidden = showHistory;
      });
    });

    renderMoods();
    renderHistory();
    renderStats();
  </script>
</body>
</html>
